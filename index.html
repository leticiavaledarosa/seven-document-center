<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seven Back Office</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: corporate top bar (brand, tabs, language, account) over a centred 1360px workspace; split-screen sign-in */
:root{
  --bg:#F5F5F6; --surface:#FFFFFF; --field:#FFFFFF; --fg:#17171A; --mute:#62626A; --line:#E3E3E7; --line-2:#D2D2D8; --stage:#E9E9EC;
  --accent:#D71920; --accent-fg:#FFFFFF; --accent-soft:#FCEBEC;
  --good:#1D7A45; --good-soft:#E4F3EA; --warn:#94600A; --warn-soft:#FBF1DC; --crit:#C41A1A; --crit-soft:#FCE6E6; --info:#2B3950; --info-soft:#E9ECF2;
  --ink:#141416;
  --f-ui:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-head:"Archivo","IBM Plex Sans Arabic","Arial Black",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --f-ar:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --s-red:#E01F26; --s-red-d:#B3161C; --s-ink:#161616; --s-char:#262628; --s-mist:#F3F3F4; --s-line:#D8D8DB; --s-mute:#6B6B70;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121214; --surface:#1B1B1E; --field:#222226; --fg:#F0F0F2; --mute:#A2A2AA; --line:#2E2E33; --line-2:#3C3C42; --stage:#0C0C0E;
  --accent:#F0464C; --accent-fg:#FFFFFF; --accent-soft:#3A1A1D;
  --good:#5CC48A; --good-soft:#15301F; --warn:#E3AE4F; --warn-soft:#382A11; --crit:#F27272; --crit-soft:#3B1818; --info:#BAC4D6; --info-soft:#252A35;
  --ink:#0A0A0B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121214; --surface:#1B1B1E; --field:#222226; --fg:#F0F0F2; --mute:#A2A2AA; --line:#2E2E33; --line-2:#3C3C42; --stage:#0C0C0E;
  --accent:#F0464C; --accent-fg:#FFFFFF; --accent-soft:#3A1A1D;
  --good:#5CC48A; --good-soft:#15301F; --warn:#E3AE4F; --warn-soft:#382A11; --crit:#F27272; --crit-soft:#3B1818; --info:#BAC4D6; --info-soft:#252A35;
  --ink:#0A0A0B; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-ui)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
html[lang=ar] :is(.top,.wrap,.login,.modal,.foot) :not(.d,.d *){letter-spacing:0!important}
.gut{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}

/* brand mark */
.bm{display:inline-flex;flex-direction:column;line-height:1;direction:ltr}
.bm-w{font:900 22px/.9 var(--f-head);letter-spacing:.02em;color:var(--fg)}
.bm-w span{color:var(--accent)}
.bm-s{font:600 7.5px var(--f-head);letter-spacing:.42em;text-transform:uppercase;color:var(--fg);margin-top:4px;padding-left:1px}
.bm.light .bm-w,.bm.light .bm-s{color:#fff}
.bm.light .bm-w span{color:#F0464C}

/* sign in */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.login-art{background:#141416;color:#fff;display:flex;flex-direction:column;justify-content:space-between;gap:40px;position:relative;overflow:hidden;padding-block:44px}
.login-art::after{content:"";position:absolute;inset:auto 0 0 auto;width:62%;height:120px;background:linear-gradient(100deg,transparent 0 22%,#E01F26 22%);opacity:.95}
.login-art::before{content:"";position:absolute;inset:auto 0 132px 0;height:8px;background:linear-gradient(100deg,#2b2b2e 0 70%,transparent 70% 71.5%,#E01F26 71.5%)}
.la-mid{max-width:520px;display:flex;flex-direction:column;gap:22px;position:relative;z-index:1}
.la-mid h1{font:800 clamp(28px,3.4vw,40px)/1.12 var(--f-head);text-wrap:balance}
.la-mid ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;color:#C9C9CF}
.la-mid li{display:flex;gap:12px;align-items:flex-start}
.la-mid li::before{content:"";flex:0 0 18px;height:2px;background:#E01F26;margin-top:11px}
.la-foot{position:relative;z-index:1;font-size:12.5px;color:#9C9CA4;letter-spacing:.08em;margin-bottom:120px}
.login-side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding-block:32px;background:var(--bg);position:relative}
.login-lang{position:absolute;top:24px;inset-inline-end:max(24px,env(safe-area-inset-right,0px))}
.login-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.login-card h2{font:800 28px var(--f-head)}
.login-card > p{color:var(--mute);margin-top:-8px}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.lrow .chk{grid-column:auto}
.link{border:0;background:none;padding:0;color:var(--fg);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.err{background:var(--crit-soft);color:var(--crit);border-radius:8px;padding:9px 12px;font-size:13px}
.btn.big{padding:12px 16px;font-size:15px}
.demo{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mute)}
.demo b{color:var(--fg);font-weight:600}
.demo code{font-family:var(--f-mono);font-size:12px;color:var(--fg)}
.login-legal{font-size:12px;color:var(--mute)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top::before{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--ink) 0 72%,var(--accent) 72%)}
.top-in{max-width:1400px;margin:0 auto;display:flex;align-items:stretch;gap:28px;min-height:64px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;flex:0 0 auto}
.brand img{max-height:36px;max-width:150px;object-fit:contain}
.brand-sep{width:1px;height:28px;background:var(--line-2)}
.brand-app{font:600 14px var(--f-ui);color:var(--mute);white-space:nowrap}
.tabs{display:flex;gap:2px;align-items:stretch}
.tab{border:0;background:none;padding:0 14px;color:var(--mute);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-current=page]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.top-r{margin-inline-start:auto;display:flex;gap:12px;align-items:center}
.lang{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--mute)}
.lang button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.lang button:nth-child(2){font-family:var(--f-ar)}
.pop{position:relative}
.menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.14);padding:6px;z-index:25;display:flex;flex-direction:column}
.menu button{border:0;background:none;text-align:start;padding:9px 12px;border-radius:7px;font-size:13.5px}
.menu button:hover{background:var(--bg)}
.menu-h{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu-h b{display:block;font-size:13.5px}
.menu-h small{color:var(--mute);font-size:12px}
.menu-l{padding:6px 12px 4px;font-size:11.5px;color:var(--mute)}
.um-btn{display:flex;align-items:center;gap:10px;border:0;background:none;padding:4px;border-radius:9px;text-align:start}
.um-btn:hover{background:var(--bg)}
.um-t b{display:block;font-size:13px;line-height:1.2}
.um-t small{color:var(--mute);font-size:11.5px}
.av{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font:700 12.5px var(--f-head);letter-spacing:.02em}

.wrap{max-width:1400px;margin:0 auto;padding-block:30px 48px;min-height:calc(100% - 140px)}
.foot{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute);padding-block:18px 28px;border-top:1px solid var(--line)}

.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-h h1{font:800 28px/1.15 var(--f-head);text-wrap:balance}
.page-h p{color:var(--mute);margin-top:6px}
.crumb{font-size:12.5px;color:var(--mute);margin-bottom:6px}
.crumb button{border:0;background:none;padding:0;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.dark{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:600}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.ghost{background:none;border-color:transparent;color:var(--mute)}
.btn.ghost:hover{color:var(--crit)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line);gap:12px}
.card-h h2{font:700 15px var(--f-head)}
.card-b{padding:18px 20px}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-draft{background:var(--info-soft);color:var(--mute)}
.st-pending{background:var(--warn-soft);color:var(--warn)}
.st-issued{background:var(--info-soft);color:var(--info)}
.st-paid{background:var(--good-soft);color:var(--good)}
.st-overdue{background:var(--crit-soft);color:var(--crit)}
.st-cancelled{background:var(--info-soft);color:var(--mute);text-decoration:line-through}

.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--mute)}
.stat b{font:700 18px var(--f-head);color:var(--fg);font-variant-numeric:tabular-nums}
.stat.warn b{color:var(--warn)} .stat.crit b{color:var(--crit)}

.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:start;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600;padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--bg)}
.tbl .n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.tbl .sub{display:block;color:var(--mute);font-size:12px}
.muted{color:var(--mute)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line-2);background:var(--field);border-radius:20px;padding:4px 12px;font-size:12.5px}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.filters input,.filters select{border:1px solid var(--line-2);background:var(--field);color:var(--fg);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px}
.filters input{flex:1;min-width:180px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.f{display:flex;flex-direction:column;gap:5px;grid-column:span 2;min-width:0}
.f.half{grid-column:span 1}
.f label,.f .lab{font-size:12.5px;color:var(--mute);font-weight:500}
.f input[type=text],.f input[type=email],.f input[type=password],.f input[type=date],.f select,.f textarea{width:100%;border:1px solid var(--line-2);background:var(--field);color:var(--fg);border-radius:8px;padding:9px 11px;font:inherit;font-size:14px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--fg);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.f textarea{min-height:64px;resize:vertical}
.f .ro{font:500 13px var(--f-mono);padding:9px 11px;border:1px dashed var(--line-2);border-radius:8px;color:var(--mute)}
.chk{display:flex;align-items:center;gap:8px;grid-column:span 2;font-size:13.5px}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.hint{grid-column:span 2;font-size:12.5px;color:var(--mute)}
fieldset{border:0;margin:0;padding:0;min-width:0}
fieldset:disabled input,fieldset:disabled select,fieldset:disabled textarea{opacity:.7}
.logo-box{grid-column:span 2;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.logo-prev{width:130px;height:56px;border:1px dashed var(--line-2);border-radius:8px;display:grid;place-items:center;background:#fff;overflow:hidden}
.logo-prev.dark{background:#161616}
.logo-prev img{max-width:100%;max-height:100%;object-fit:contain}
.logo-prev em{font-size:11px;color:#8a8a8a;font-style:normal}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}

.lockmsg{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.ed{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.ed-form{border-inline-end:1px solid var(--line);overflow:auto;max-height:calc(100vh - 140px);padding:6px 18px 32px}
.sec{border-bottom:1px solid var(--line)}
.sec summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:15px 2px;font:700 12.5px var(--f-head);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
html[lang=ar] .sec summary{font-size:14px;text-transform:none}
.sec summary::-webkit-details-marker{display:none}
.sec summary::after{content:"+";font:400 18px var(--f-ui);color:var(--mute)}
.sec[open] summary::after{content:"–"}
.sec .grid{padding:0 2px 18px}
.item{border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 2px 10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.item .f{grid-column:span 4}
.item .f.q{grid-column:span 1}
.item-h{grid-column:span 4;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute)}
.item-h button{border:0;background:none;color:var(--accent);font-size:12px;padding:2px 4px}
.item-total{grid-column:span 4;text-align:end;font:500 13px var(--f-mono)}
.add-row{display:flex;gap:8px;margin:0 2px 18px;flex-wrap:wrap}
.add-row select{flex:1;min-width:0;border:1px solid var(--line-2);background:var(--field);color:var(--fg);border-radius:8px;padding:7px 9px;font:inherit;font-size:13px}
.ed-prev{display:flex;flex-direction:column;min-width:0;background:var(--stage)}
.picker{display:flex;gap:10px;overflow-x:auto;padding:12px 14px 8px;background:var(--bg);border-bottom:1px solid var(--line)}
.thumb{flex:0 0 auto;border:2px solid transparent;background:none;padding:4px;border-radius:10px;display:flex;flex-direction:column;gap:5px;text-align:start}
.thumb[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.thumb-vp{width:94px;height:133px;overflow:hidden;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.2);background:#fff;position:relative;pointer-events:none;direction:ltr}
.thumb-vp .d{transform:scale(.1184);transform-origin:0 0;position:absolute;left:0;top:0}
.thumb span{font-size:12px;font-weight:600;padding-inline-start:2px}
.stage{flex:1;overflow:auto;padding:22px 16px 40px;display:flex;justify-content:center;direction:ltr}
#sheetWrap{position:relative;flex:0 0 auto}
#sheet{transform-origin:0 0;position:absolute;left:0;top:0;width:794px;display:flex;flex-direction:column;gap:28px}
#sheet .pg{box-shadow:0 6px 30px rgba(0,0,0,.18)}
.hist{margin-top:20px}
.hist ol{list-style:none;margin:0;padding:6px 0}
.hist li{display:flex;gap:14px;padding:9px 20px;font-size:13px;flex-wrap:wrap}
.hist li time{color:var(--mute);font-size:12.5px;white-space:nowrap;min-width:170px}

.verify{max-width:680px}
.vbox{display:flex;gap:8px;margin:14px 0}
.vbox input{flex:1;min-width:0;border:1px solid var(--line-2);background:var(--field);color:var(--fg);border-radius:8px;padding:11px 12px;font:500 15px var(--f-mono)}
.vres{border-radius:12px;padding:18px 20px;margin-top:6px}
.vres.ok{background:var(--good-soft)}
.vres.bad{background:var(--crit-soft)}
.vres h2{font:800 17px var(--f-head);margin-bottom:10px}
.vres.ok h2{color:var(--good)} .vres.bad h2{color:var(--crit)}
.vres dl{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;margin:0}
.vres dt{color:var(--mute)} .vres dd{margin:0}
.try{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--mute)}

.modal{position:fixed;inset:0;z-index:40;background:rgba(10,10,12,.55);display:grid;place-items:center;padding:16px}
.modal-card{width:100%;max-width:540px;background:var(--surface);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.modal-card h2{font:800 19px var(--f-head)}
.attach{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;font-size:12.5px;font-family:var(--f-mono)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;max-width:calc(100% - 32px)}

@media (max-width:1080px){.um-t{display:none}.brand-app,.brand-sep{display:none}}
@media (max-width:900px){
  .login{grid-template-columns:minmax(0,1fr)}
  .login-art{padding-block:28px}.la-foot{margin-bottom:60px}.login-art::after{height:56px}.login-art::before{bottom:64px}.la-mid ul{display:none}
  .login-lang{position:static;align-self:stretch;display:flex;justify-content:flex-end}
  .top-in{flex-wrap:wrap;gap:0 12px}
  .brand{min-height:56px}
  .tabs{order:3;width:100%;overflow-x:auto;min-height:44px;border-top:1px solid var(--line)}
  .ed{grid-template-columns:minmax(0,1fr)}.ed-form{max-height:none;border-inline-end:0;order:2}.ed-prev{order:1}
  .two{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){.vres dl{grid-template-columns:1fr}.top-r .btn.primary{padding:7px 10px;font-size:13px}.page-h h1{font-size:23px}}

/* ====================== SHEET (A4 @ 96dpi = 794 x 1123) ====================== */
.d{width:794px;min-height:1123px;background:#fff;color:var(--s-ink);font:11.5px/1.5 var(--f-ui);position:relative;overflow:hidden;display:flex;flex-direction:column;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.d *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.d p,.d h1,.d h2,.d h3{margin:0}
.d table{border-collapse:collapse;width:100%}
.d .n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.d .b{font-weight:700}
.d .sub{color:var(--s-mute);font-size:10.5px}
.wm{display:inline-flex;flex-direction:column;line-height:1}
.wm-t{font:900 40px/.9 var(--f-head);letter-spacing:.015em;color:var(--s-ink)}
.wm-t span{color:var(--s-red)}
.wm-s{font:600 10px var(--f-head);letter-spacing:.42em;text-transform:uppercase;color:var(--s-ink);margin-top:6px;padding-left:2px}
.wm.light .wm-t,.wm.light .wm-s{color:#fff}
.wm.sm .wm-t{font-size:26px}.wm.sm .wm-s{font-size:7.5px;margin-top:4px}
.lg{max-height:66px;max-width:230px;object-fit:contain;display:block}
.lg-chip{background:#fff;border-radius:6px;padding:6px 10px;display:inline-block}
.sig{margin-top:26px;width:230px}
.sig i{display:block;border-top:1px solid var(--s-ink);margin-bottom:6px;height:34px;border-top:0;border-bottom:1px solid var(--s-ink)}
.sig b{display:block;margin-top:6px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:3px 12px}
.kv dt{color:var(--s-mute)}
.kv dd{margin:0}
.words{margin-top:14px}
.words b{display:block}

/* 1 · Classic — the current standard */
.l-classic{padding:58px 64px 48px}
.c1-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.c1-head h1{font:700 38px var(--f-ui);letter-spacing:-.01em}
.c1-grid{display:grid;grid-template-columns:minmax(0,1fr) 140px 210px;gap:0 18px}
.c1-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.c1-meta{text-align:right;display:flex;flex-direction:column;gap:10px}
.c1-meta b{display:block}
.c1-seller{border-left:2px solid var(--s-red);padding-left:14px}
.c1-cur{font-weight:700;margin:24px 0 10px}
.c1-tbl th,.c1-tbl td{border:1px solid var(--s-ink);padding:6px 9px;vertical-align:top;text-align:left}
.c1-tbl thead th{border-bottom:3px solid var(--s-red)}
.c1-tbl thead th.n,.c1-tbl td.n{text-align:right}
.c1-tbl tfoot td{border:0;padding:6px 9px}
.c1-tbl tfoot td.lab{text-align:right;font-weight:700}
.c1-tbl tfoot tr.tot td.n{border:1px solid var(--s-ink);font-weight:700}
.c1-tbl tfoot tr.tot td.lab{color:var(--s-red)}
.c1-note{margin-top:auto;padding-top:30px;font-style:italic;color:var(--s-mute);font-size:10.5px}

/* 2 · Letterhead — Seven stationery */
.l-letter .lh-head{display:flex;align-items:center;gap:22px;padding:34px 48px 18px}
.lh-div{width:1.5px;align-self:stretch;background:var(--s-ink)}
.lh-name b{display:block;font:800 21px var(--f-head);color:var(--s-red);letter-spacing:.01em}
.lh-name span{font-size:13px;color:var(--s-ink)}
.lh-stripe{height:9px;margin:0 0 0 48px;background:linear-gradient(100deg,var(--s-ink) 0 74%,#fff 74% 75.4%,var(--s-red) 75.4%)}
.lh-body{flex:1;padding:26px 48px 22px;position:relative;z-index:1;display:flex;flex-direction:column}
.lh-dr{display:flex;justify-content:space-between;margin-bottom:22px}
.lh-body h1{font:800 21px var(--f-head);letter-spacing:.02em;text-transform:uppercase;margin-bottom:14px}
.lh-to{background:var(--s-mist);border-left:3px solid var(--s-red);padding:7px 12px;margin-bottom:14px}
.lh-kv{margin-bottom:18px}
.lh-kv td{padding:5px 0;border-bottom:1px solid var(--s-line);vertical-align:top}
.lh-kv td:first-child{width:170px;color:var(--s-mute)}
.lh-body h2{font:800 14px var(--f-head);margin:6px 0 8px}
.lh-tbl th{font-weight:600;text-align:left;padding:7px 8px;background:var(--s-ink);color:#fff}
.lh-tbl td{padding:7px 8px;border-bottom:1px solid var(--s-line);vertical-align:top}
.lh-tbl th.n{text-align:right}
.tots{margin-left:auto;width:270px;margin-top:10px}
.tots div{display:flex;justify-content:space-between;padding:4px 0}
.lh-tots .grand{border-top:2px solid var(--s-ink);margin-top:4px;padding-top:7px;font-weight:700;font-size:13px}
.lh-tots .grand span:last-child{color:var(--s-red)}
.lh-wmk{position:absolute;left:50%;top:50%;transform:translate(-50%,-40%);opacity:.07;pointer-events:none;z-index:0;text-align:center}
.lh-wmk .wm-t{font-size:170px}
.lh-wmk .wm-s{font-size:34px;letter-spacing:.3em}
.lh-wmk img{width:520px;max-width:none}
.lh-note{font-size:10px;color:var(--s-mute);margin-top:14px}
.lh-foot{position:relative;background:var(--s-ink);color:#fff;display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:14px;padding:22px 48px 20px;font-size:10px;line-height:1.4}
.lh-foot::before{content:"";position:absolute;left:0;right:0;top:-8px;height:8px;background:linear-gradient(100deg,transparent 0 68%,var(--s-red) 68%)}
.lh-foot div{display:flex;gap:8px;align-items:flex-start}
.lh-foot svg{flex:0 0 22px;width:22px;height:22px;padding:4px;border:1px solid rgba(255,255,255,.55);border-radius:50%;fill:none;stroke:#fff;stroke-width:1.8}
.lh-foot b{display:block;font-size:10.5px}

/* 3 · Executive — black head band */
.ex-head{background:var(--s-ink);color:#fff;display:flex;justify-content:space-between;gap:24px;padding:40px 52px 30px;border-bottom:6px solid var(--s-red)}
.ex-from p{margin-top:14px;color:#BDBDC2;font-size:10.5px;line-height:1.55}
.ex-title{text-align:right}
.ex-title h1{font:900 46px/1 var(--f-head);letter-spacing:.02em;text-transform:uppercase}
.ex-title span{display:block;margin-top:10px;font:500 12px var(--f-mono);color:var(--s-red)}
.ex-title span.dt{color:#BDBDC2;margin-top:4px}
.ex-band{background:var(--s-char);color:#fff;display:grid;grid-template-columns:1.6fr 1fr 1fr 1.3fr;gap:16px;padding:18px 52px}
.ex-band small{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#9B9BA0;margin-bottom:4px}
.ex-band .amt{font:800 20px var(--f-head);color:#fff}
.ex-band .amt em{font-style:normal;color:var(--s-red);margin-right:4px}
.ex-body{padding:26px 52px 20px;flex:1;display:flex;flex-direction:column}
.ex-tbl th{font:700 9.5px var(--f-head);letter-spacing:.12em;text-transform:uppercase;text-align:left;padding:8px;border-bottom:2px solid var(--s-red)}
.ex-tbl th.n{text-align:right}
.ex-tbl td{padding:9px 8px;border-bottom:1px solid var(--s-line);vertical-align:top}
.ex-tots .grand{background:var(--s-ink);color:#fff;padding:8px 10px;margin-top:6px;font-weight:700;font-size:13px}
.ex-tots div{padding:4px 10px}
.ex-two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
.ex-two h3{font:700 9.5px var(--f-head);letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px;color:var(--s-red)}
.ex-box{background:var(--s-mist);padding:14px 16px}
.ex-two .kv{grid-template-columns:105px 1fr;font-size:10.5px}
.ex-foot{padding:14px 52px;border-top:1px solid var(--s-line);display:flex;justify-content:space-between;font-size:9.5px;color:var(--s-mute)}

/* 4 · Minimal — hairlines and mono figures */
.l-min{padding:56px 64px 44px}
.mn-head{display:flex;justify-content:space-between;align-items:flex-end}
.mn-head h1{font:400 40px/1 var(--f-head);letter-spacing:-.01em;text-align:right}
.mn-head .no{display:block;text-align:right;font:500 11.5px var(--f-mono);margin-top:8px;color:var(--s-mute)}
.mn-rule{height:2px;background:var(--s-red);margin:22px 0 20px;width:64px}
.mn-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding-bottom:18px;border-bottom:1px solid var(--s-line)}
.mn-l{display:block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--s-mute);margin-bottom:4px}
.mn-parties{display:grid;grid-template-columns:1fr 1fr;gap:32px;padding:18px 0 22px}
.mn-tbl th{font-weight:500;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--s-mute);text-align:left;padding:6px 0;border-bottom:1px solid var(--s-ink)}
.mn-tbl th.n{text-align:right}
.mn-tbl td{padding:10px 0;border-bottom:1px solid var(--s-line);vertical-align:top}
.mn-tbl td.n,.mn-tbl td.idx{font-family:var(--f-mono);font-size:11px}
.mn-tbl td+td,.mn-tbl th+th{padding-left:14px}
.mn-sum{display:flex;justify-content:flex-end;gap:40px;margin-top:14px;font-family:var(--f-mono);font-size:11px}
.mn-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:18px;padding-top:14px;border-top:1px solid var(--s-ink)}
.mn-total strong{font:400 30px var(--f-head)}
.mn-total strong em{font-style:normal;color:var(--s-red);font-size:16px;margin-right:6px;font-family:var(--f-mono)}
.mn-foot2{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:28px;font-size:10.5px}
.mn-foot2 .kv{grid-template-columns:110px 1fr}
.mn-note{margin-top:auto;padding-top:26px;font-size:10px;color:var(--s-mute)}

/* 5 · Sidebar — red column */
.l-side{flex-direction:row}
.sd-bar{width:238px;flex:0 0 238px;background:var(--s-red);color:#fff;padding:44px 26px 28px;display:flex;flex-direction:column;gap:22px;font-size:10.5px;line-height:1.5}
.sd-bar .wm-t span{color:var(--s-ink)}
.sd-bar h3{font:700 9px var(--f-head);letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.72);margin-bottom:6px}
.sd-bar .kv{grid-template-columns:1fr;gap:0}
.sd-bar .kv dt{color:rgba(255,255,255,.72);font-size:9.5px;margin-top:5px}
.sd-tag{margin-top:auto;background:var(--s-ink);margin-left:-26px;margin-right:-26px;margin-bottom:-28px;padding:16px 26px;font:600 11px var(--f-head);letter-spacing:.04em}
.sd-main{flex:1;min-width:0;padding:46px 44px 34px;display:flex;flex-direction:column}
.sd-main h1{font:900 40px/1 var(--f-head);text-transform:uppercase;letter-spacing:.01em}
.sd-main h1 span{display:block;width:44px;height:5px;background:var(--s-ink);margin-top:14px}
.sd-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0;padding:12px 0;border-top:1px solid var(--s-line);border-bottom:1px solid var(--s-line)}
.sd-meta small,.sd-bill small{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--s-mute)}
.sd-meta b{font-family:var(--f-mono);font-weight:500}
.sd-bill{margin-bottom:20px}
.sd-bill p.nm{font:700 14px var(--f-head);margin:3px 0 2px}
.sd-tbl th{text-align:left;font-weight:600;padding:7px 6px;border-bottom:2px solid var(--s-ink);font-size:10.5px}
.sd-tbl th.n{text-align:right}
.sd-tbl td{padding:8px 6px;border-bottom:1px solid var(--s-line);vertical-align:top}
.sd-tots .grand{font:800 16px var(--f-head);border-top:2px solid var(--s-ink);margin-top:4px;padding-top:8px}
.sd-tots .grand span:last-child{color:var(--s-red)}
.sd-terms{margin-top:22px}
.sd-terms h3{font:700 9px var(--f-head);letter-spacing:.18em;text-transform:uppercase;color:var(--s-mute);margin-bottom:6px}
.sd-terms .kv{font-size:10.5px}
.sd-note{margin-top:auto;padding-top:20px;font-size:9.5px;color:var(--s-mute)}

/* 6 · Statement — big amount due */
.l-bold{padding:40px 48px 0}
.bd-head{display:flex;justify-content:space-between;align-items:center;gap:20px}
.bd-head p{text-align:right;font-size:10px;line-height:1.55;color:var(--s-mute)}
.bd-head p b{color:var(--s-ink)}
.bd-hero{margin-top:24px;display:grid;grid-template-columns:1fr 1fr;color:#fff;background:linear-gradient(110deg,var(--s-red) 0 54%,var(--s-ink) 54%)}
.bd-hero > div{padding:22px 24px}
.bd-hero small{display:block;font:700 9.5px var(--f-head);letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.bd-hero h1{font:800 20px var(--f-head);margin:6px 0 4px;font-family:var(--f-mono);font-weight:500}
.bd-hero .r{text-align:right}
.bd-hero strong{display:block;font:900 30px/1.1 var(--f-head);margin-top:6px}
.bd-hero strong em{font-style:normal;color:var(--s-red);font-size:16px;margin-right:6px}
.bd-cards{display:grid;grid-template-columns:1fr 1.25fr;gap:14px;margin:16px 0 20px}
.bd-card{background:var(--s-mist);padding:14px 16px;border-radius:4px}
.bd-card h3{font:700 9.5px var(--f-head);letter-spacing:.16em;text-transform:uppercase;color:var(--s-red);margin-bottom:6px}
.bd-card .kv{grid-template-columns:100px 1fr;font-size:10.5px}
.bd-card .nm{font:700 13px var(--f-head);margin-bottom:2px}
.bd-tbl th{background:var(--s-ink);color:#fff;text-align:left;padding:8px;font:700 9.5px var(--f-head);letter-spacing:.1em;text-transform:uppercase}
.bd-tbl th.n{text-align:right}
.bd-tbl td{padding:9px 8px;vertical-align:top}
.bd-tbl tbody tr:nth-child(even) td{background:var(--s-mist)}
.bd-bottom{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-top:18px;align-items:start}
.bd-tots{background:var(--s-mist);padding:10px 16px;border-radius:4px}
.bd-tots div{display:flex;justify-content:space-between;padding:4px 0}
.bd-tots .grand{border-top:2px solid var(--s-red);margin-top:4px;padding-top:7px;font:800 14px var(--f-head)}
.bd-foot{margin-top:auto;margin-left:-48px;margin-right:-48px;padding:12px 48px 16px;border-top:4px solid var(--s-red);display:flex;justify-content:space-between;font-size:9.5px;color:var(--s-mute);gap:16px}
.bd-rest{flex:1;display:flex;flex-direction:column}



/* additions for the platform */
.d tfoot td{font-weight:700;border-top:2px solid var(--s-ink)}
.ar{font-family:var(--f-ar);font-weight:400;direction:rtl;unicode-bidi:isolate;margin-left:6px;opacity:.75;font-size:.92em;letter-spacing:0;text-transform:none}
.ar-t{display:block;font-family:var(--f-ar);font-size:.5em;font-weight:600;direction:rtl;margin-top:6px;letter-spacing:0;text-transform:none}
.stamp{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%) rotate(-16deg);border:5px solid rgba(224,31,38,.38);color:rgba(224,31,38,.38);font:900 60px/1 var(--f-head);padding:10px 26px;letter-spacing:.08em;z-index:5;pointer-events:none;white-space:nowrap}
.noterow{display:flex;gap:14px;align-items:center;margin-top:auto;padding-top:24px}
.noterow p{font-size:10px;color:var(--s-mute)}
.qr{display:flex;gap:10px;align-items:center;flex:0 0 auto}
.qr img{width:74px;height:74px;image-rendering:pixelated;display:block}
.qr span{font-size:9.5px;color:var(--s-mute);line-height:1.35}
.qr span b{color:var(--s-ink);font-family:var(--f-mono);font-weight:500}
.qr-ph{width:74px;height:74px;border:1px dashed var(--s-line);display:grid;place-items:center;font-size:10px;color:var(--s-mute)}
.loi{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.spec td{padding:6px 0;border-bottom:1px solid var(--s-line);vertical-align:top}
.spec td:first-child{width:160px;color:var(--s-mute)}
.l-classic .c1-note p{font-style:italic}

/* two companies, intercompany, security */
:root{--sgt:#C8161D;--sgt-soft:#FCEAEB;--stl:#0B6E79;--stl-soft:#E2F3F4;--ic:#6B3FA0;--ic-soft:#F1EAF9}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sgt:#F26B70;--sgt-soft:#3A1A1D;--stl:#4CC3CF;--stl-soft:#123236;--ic:#B897E6;--ic-soft:#2A2038}}
:root[data-theme="dark"]{--sgt:#F26B70;--sgt-soft:#3A1A1D;--stl:#4CC3CF;--stl-soft:#123236;--ic:#B897E6;--ic-soft:#2A2038}
.co{display:inline-flex;align-items:center;justify-content:center;min-width:38px;padding:2px 7px;border-radius:5px;font:700 11px var(--f-mono);letter-spacing:.04em;color:#fff;white-space:nowrap;direction:ltr}
.co-sgt{background:var(--sgt)} .co-stl{background:var(--stl)}
:root:not([data-theme="light"]) .co{color:#fff}
.ic{display:inline-flex;align-items:center;padding:1px 6px;border-radius:5px;font:700 10.5px var(--f-mono);background:var(--ic-soft);color:var(--ic);border:1px solid var(--ic)}
.cofilter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.cofilter button{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500}
.cofilter button[aria-pressed=true]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg);font-weight:600}
.cofilter .icbtn b{font-variant-numeric:tabular-nums;color:var(--mute);font-weight:600}
.stat{cursor:pointer}
.stat[aria-pressed=true]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.doctbl td.prod{max-width:240px;color:var(--fg)}
.doctbl tbody tr.row-sgt td:first-child{box-shadow:inset 3px 0 0 var(--sgt)}
.doctbl tbody tr.row-stl td:first-child{box-shadow:inset 3px 0 0 var(--stl)}
html[dir=rtl] .doctbl tbody tr.row-sgt td:first-child{box-shadow:inset -3px 0 0 var(--sgt)}
html[dir=rtl] .doctbl tbody tr.row-stl td:first-child{box-shadow:inset -3px 0 0 var(--stl)}
.tbl-foot{padding:10px 16px;font-size:12.5px;color:var(--mute);border-top:1px solid var(--line)}
.coband{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px;border:1px solid}
.co-b-sgt.coband{background:var(--sgt-soft);border-color:var(--sgt)}
.co-b-stl.coband{background:var(--stl-soft);border-color:var(--stl)}
.coband .btn{margin-inline-start:auto}
.icband{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--ic-soft);color:var(--fg);border:1px solid var(--ic);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13.5px}
.errband{background:var(--crit-soft);color:var(--crit);border:1px solid var(--crit);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;font-weight:500}
.modal-card.wide{max-width:640px}
.cocards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cocard{display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:start;border:1.5px solid var(--line-2);background:var(--surface);border-radius:12px;padding:14px 16px}
.cocard:hover:not(:disabled){border-color:var(--mute)}
.cocard b{font-size:15px}
.cocard small{color:var(--mute);font-size:12.5px}
.cocard-top{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:4px}
.cocard-radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2)}
.co-b-sgt.cocard[aria-pressed=true]{border-color:var(--sgt);background:var(--sgt-soft)}
.co-b-stl.cocard[aria-pressed=true]{border-color:var(--stl);background:var(--stl-soft)}
.co-b-sgt.cocard[aria-pressed=true] .cocard-radio{border:5px solid var(--sgt)}
.co-b-stl.cocard[aria-pressed=true] .cocard-radio{border:5px solid var(--stl)}
.cocard:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.arch{margin-top:20px}
.archb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;font-size:13px}
.archb small{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.archb code{font-family:var(--f-mono);font-size:12.5px;word-break:break-all}
.subh{font:700 17px var(--f-head);margin:28px 0 10px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi small{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.kpi strong{font:800 22px/1.15 var(--f-head);font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--mute);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi.warnk strong{color:var(--warn)}
.layers{list-style:none;margin:0;padding:6px 0}
.layers li{display:flex;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line)}
.layers li:last-child{border-bottom:0}
.layers b{display:block;font-size:13.5px}
.layers small{color:var(--mute);font-size:12.5px}

const title=()=>T().n;
const titleAr=()=>S.bilingual?`<span class="ar-t">${T().ar}</span>`:'';

const dueL=()=>S.type==='quotation'||isLOI()?'Valid until':isPL()?'Shipment date':'Due date';
const dueV=st=>S.due?fd(S.due,st):(money()&&S.type!=='quotation'?'Upon receipt':'—');
const numShown=()=>S.number||nextNumber(S);
function calc(){const rows=S.items.map(it=>{const q=num(it.qty),p=num(it.price);return Object.assign({},it,{q,p,t:q*p})});
  const sub=rows.reduce((a,r)=>a+r.t,0),vr=num(S.vat),vat=sub*vr/100;return{rows,sub,vr,vat,total:sub+vat}}
function pl(){const rows=S.items.map(it=>Object.assign({},it,{q:num(it.qty),pk:num(it.pkgs),nt:num(it.net),gr:num(it.gross)}));
  return{rows,pkgs:rows.reduce((a,r)=>a+r.pk,0),net:rows.reduce((a,r)=>a+r.nt,0),gross:rows.reduce((a,r)=>a+r.gr,0)}}
function headline(){
  if(money())return[t(S.type==='quotation'?'Quoted total':'Amount due'),`<em>${S.currency}</em>${mf(calc().total)}`];
  if(isPL())return[t('Gross weight'),`${qf(pl().gross)}<em style="margin:0 0 0 6px">kg</em>`];
  return[t('Valid until'),S.due?fd(S.due,'short'):'15 days']}
function logo(v){
  if(v==='light'){if(CO.logoLight)return `<img class="lg" src="${CO.logoLight}" alt="Seven General Trading">`;if(CO.logo)return `<span class="lg-chip"><img class="lg" style="max-height:52px" src="${CO.logo}" alt="Seven General Trading"></span>`}
  else if(CO.logo)return `<img class="lg" src="${CO.logo}" alt="Seven General Trading">`;
  return `<div class="wm ${v==='light'?'light':''} ${v==='sm'?'sm':''}"><div class="wm-t">SE<span>V</span>EN</div><div class="wm-s">${e(CO.sub||'General Trading')}</div></div>`}

  if(isPL())l=l.filter(r=>!['Price validity','Payment terms'].includes(r[0]));
  return l.filter(r=>String(r[1]||'').trim())}
const TS=()=>isLOI()?[]:terms();
function bank(){if(!money()||S.type==='quotation')return[];const B=CO.bank;return[['Beneficiary name',B.beneficiary],['Beneficiary address',B.address],['Bank name',B.bank],['SWIFT / BIC',B.swift],['Account number',B.account],['IBAN',B.iban],['Currency',S.currency]].filter(r=>String(r[1]||'').trim())}

const descCell=r=>`${nl(r.desc)}${r.hs?`<div class="sub">HS code: ${e(r.hs)}</div>`:''}`;

  if(isLOI())return loiBlock();
  if(isPL()){const P=pl();return `<table class="${cls}"><thead><tr><th style="width:34px">#</th><th>${t('Description')}</th><th class="n">${t('Qty')}</th><th class="n">${t('Packages')}</th><th class="n">${t('Net weight (kg)')}</th><th class="n">${t('Gross weight (kg)')}</th></tr></thead><tbody>${P.rows.map((r,i)=>`<tr><td>${i+1}</td><td>${descCell(r)}</td><td class="n">${qf(r.q)} ${e(r.unit)}</td><td class="n">${qf(r.pk)}</td><td class="n">${qf(r.nt)}</td><td class="n">${qf(r.gr)}</td></tr>`).join('')}</tbody><tfoot><tr class="tot"><td></td><td class="lab" style="text-align:left">${t('Total')}</td><td></td><td class="n">${qf(P.pkgs)}</td><td class="n">${qf(P.net)}</td><td class="n">${qf(P.gross)}</td></tr></tfoot></table>`}

/* ---- A4 pagination: pages never stretch; overflow continues on a new page with the same frame ---- */
function paginate(host,html){
  host.innerHTML='';
  const tmp=document.createElement('div');tmp.innerHTML=html.trim();
  const src=tmp.firstElementChild,srcFlow=src.querySelector('[data-flow]');
  const blocks=[...srcFlow.children];
  const mk=()=>{const p=src.cloneNode(true);p.classList.add('pg');const f=p.querySelector('[data-flow]');f.innerHTML='';host.appendChild(p);return{p,f}};
  const pages=[];let cur;const newPage=()=>{cur=mk();pages.push(cur);return cur};newPage();
  const over=()=>cur.f.scrollHeight>cur.f.clientHeight+1;
  const isTbl=b=>b.tagName==='TABLE'&&b.tBodies.length&&b.tBodies[0].rows.length>1;
  const shell=t=>{const c=t.cloneNode(true);[...c.tBodies[0].rows].forEach(r=>r.remove());if(c.tFoot)c.tFoot.remove();return c};
  function placeTable(t){
    const rows=[...t.tBodies[0].rows];let part=shell(t);cur.f.appendChild(part);
    rows.forEach(r=>{const rc=r.cloneNode(true);part.tBodies[0].appendChild(rc);
      if(over()){rc.remove();if(!part.tBodies[0].rows.length)part.remove();newPage();part=shell(t);part.classList.add('cont');cur.f.appendChild(part);part.tBodies[0].appendChild(rc)}});
    if(t.tFoot){part.appendChild(t.tFoot.cloneNode(true));
      if(over()&&part.tBodies[0].rows.length>1){const last=part.tBodies[0].rows[part.tBodies[0].rows.length-1];const tf=part.tFoot;tf.remove();last.remove();newPage();part=shell(t);part.classList.add('cont');cur.f.appendChild(part);part.tBodies[0].appendChild(last);part.appendChild(tf)}}}
  for(let i=0;i<blocks.length;i++){
    const b=blocks[i];
    if(isTbl(b)){placeTable(b);continue}
    const n=b.cloneNode(true);cur.f.appendChild(n);
    let moved=false;
    if(over()&&cur.f.children.length>1){n.remove();const pv=b.hasAttribute('data-keepprev')?cur.f.lastElementChild:null;const take=pv&&pv.tagName!=='TABLE'&&cur.f.children.length>1;if(take)pv.remove();newPage();if(take)cur.f.appendChild(pv);cur.f.appendChild(n);moved=true}
    if(!moved&&b.hasAttribute('data-keep')&&blocks[i+1]){
      const nx=blocks[i+1];let probe;
      if(isTbl(nx)){probe=shell(nx);probe.tBodies[0].appendChild(nx.tBodies[0].rows[0].cloneNode(true))}else probe=nx.cloneNode(true);
      cur.f.appendChild(probe);const o=over();probe.remove();
      if(o&&cur.f.children.length>1){n.remove();newPage();cur.f.appendChild(n)}}
  }

async function fingerprint(d){const snap=JSON.stringify({c:d.companyId,n:d.number,t:d.type,dt:d.date,b:d.buyer,i:d.items,tm:d.terms,cur:d.currency,v:d.vat});
  try{const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(snap));return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(x){return fakeFp(snap)}}

  const layers=[
   [tr('Invitation-only accounts','حسابات بدعوة فقط'),tr('No public sign-up. Only the administrator can add people.','لا يوجد تسجيل عام. المسؤول فقط يضيف الأشخاص.')],

    case 'invite':inviteModal();break;
    case 'sendinvite':{const n=$('#i-name').value.trim(),em=$('#i-email').value.trim().toLowerCase(),r=$('#i-role').value;
      if(!n||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){toast(tr('Enter a name and a valid email','أدخل الاسم وبريدًا صحيحًا'));break}
      DB.users.push({id:uid(),name:n,email:em,role:r,title:roleName(r),mfa:false,invited:true});audit('invite',em);$('#modal').hidden=true;render();toast(tr('Invitation recorded (demo)','تم تسجيل الدعوة (تجريبي)'));break}
    case 'newclient':editClient={id:'',name:'',address:'',taxLabel:'Tax ID',taxId:'',contact:'',country:''};render();break;
    case 'cancelclient':editClient=null;render();break;
    case 'saveclient':{if(!editClient.name.trim()){toast(tr('Enter the company name first','أدخل اسم الشركة أولًا'));break}
      if(editClient.id){Object.assign(DB.clients.find(c=>c.id===editClient.id),editClient)}else{editClient.id=uid();DB.clients.push(editClient)}editClient=null;render();toast(tr('Client saved','تم حفظ العميل'));break}
    case 'newproduct':editProduct={id:'',desc:'',hs:'',unit:'MT',price:'0',pack:'10'};render();break;
    case 'cancelproduct':editProduct=null;render();break;
    case 'saveproduct':{if(!editProduct.desc.trim()){toast(tr('Enter a description first','أدخل الوصف أولًا'));break}
      if(editProduct.id){Object.assign(DB.products.find(p=>p.id===editProduct.id),editProduct)}else{editProduct.id=uid();DB.products.push(editProduct)}editProduct=null;render();toast(tr('Product saved','تم حفظ المنتج'));break}
  }});
function doVerify(){const q=vQuery.replace(/\s+/g,'').toUpperCase();const d=DB.docs.find(x=>x.number&&x.number.toUpperCase()===q);vResult=d?d.id:(q?'none':null);render()}
function syncGroup(){DB.companies.forEach(c=>{const g=DB.clients.find(x=>x.group===c.id);if(g){g.name=c.name;g.address=c.address;g.taxId=c.trn;g.contact=c.email}})}
let setT;
document.addEventListener('input',ev=>{
  const x=ev.target,ds=x.dataset;
  if(x.id==='fQ'){docFilter.q=x.value;const pos=x.selectionStart;render();const n=$('#fQ');n.focus();n.setSelectionRange(pos,pos);return}
  if(x.id==='l-code'){x.value=x.value.replace(/\D/g,'').slice(0,6);return}
  if(ds.c!=null&&editClient){editClient[ds.c]=x.value;return}
  if(ds.p!=null&&editProduct){editProduct[ds.p]=x.value;return}
  if(ds.co!=null){coOf(DB,setCo)[ds.co]=x.value;syncGroup();clearTimeout(setT);setT=setTimeout(()=>audit('settings',coName(setCo)),1500);save();return}
  if(ds.b!=null){coOf(DB,setCo).bank[ds.b]=x.value;clearTimeout(setT);setT=setTimeout(()=>audit('settings',coName(setCo)),1500);save();return}
  const d=cur();if(!d||view!=='editor')return;
  if(ds.k&&x.type!=='checkbox'&&x.tagName!=='SELECT'){const p=ds.k.split('.');let o=d;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=x.value;preview();return}
  if(ds.it){const box=x.closest('.item'),i=+box.dataset.i;d.items[i][ds.it]=x.value;const tt=box.querySelector('.item-total');if(tt)tt.textContent=mf(num(d.items[i].qty)*num(d.items[i].price));preview()}
});
document.addEventListener('change',ev=>{
  const x=ev.target,ds=x.dataset;
  if(x.id==='fStatus'){docFilter.status=x.value;render();return}
  if(x.id==='n-type'&&newDlg){newDlg.type=x.value;renderNew();return}
  if(x.type==='file'&&x.files[0]){const k=x.id==='f-logo'?'logo':'logoLight';const r=new FileReader();r.onload=()=>{coOf(DB,setCo)[k]=r.result;audit('settings',coName(setCo));render();toast(tr('Logo updated on this company’s documents','تم تحديث الشعار في مستندات هذه الشركة'))};r.readAsDataURL(x.files[0]);return}
  const d=cur();if(!d||view!=='editor')return;
  if(x.id==='e-client'){const c=DB.clients.find(c=>c.id===x.value);d.clientId=c?c.id:'';if(c)d.buyer={name:c.name,address:c.address,taxLabel:c.taxLabel,taxId:c.taxId,contact:c.contact};render();return}
  if(x.id==='e-addp'&&x.value){const p=DB.products.find(p=>p.id===x.value);d.items.push(itemFrom(p,27));x.value='';$('#items').innerHTML=itemsHTML(d);preview();return}
  if(ds.k&&(x.type==='checkbox'||x.tagName==='SELECT')){const p=ds.k.split('.');let o=d;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=x.type==='checkbox'?x.checked:x.value;
    if(ds.k==='type'){if(x.value==='loi'&&d.layout==='classic')d.layout='letter';render();return}
    preview()}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){if(!$('#modal').hidden){$('#modal').hidden=true;newDlg=null}if(menu){menu='';renderTop()}}
  if(ev.key==='Enter'&&ev.target.id==='vq'){vQuery=ev.target.value.trim();doVerify()}});


/* ================= self-running demo ================= */
const TOUR={on:false,paused:false,stop:false,step:0,total:0,el:null};
const wait=ms=>new Promise((res,rej)=>{let left=ms;const t=setInterval(()=>{if(TOUR.stop){clearInterval(t);rej('stop');return}if(!TOUR.paused)left-=50;if(left<=0){clearInterval(t);res()}},50)});
const q=s=>document.querySelector(s);
async function until(sel,ms=3000){const t0=Date.now();while(!q(sel)){if(Date.now()-t0>ms)throw 'missing '+sel;await wait(80)}return q(sel)}
function ringTo(el,sel){TOUR.el=el;TOUR.sel=sel||'';if(el)el.scrollIntoView({block:'center',behavior:'smooth'})}
function placeRing(){const r=q('#tourRing'),c=q('#tourCursor');if(!TOUR.on){return}
  if(TOUR.el&&!document.contains(TOUR.el)&&TOUR.sel)TOUR.el=q(TOUR.sel);
  if(TOUR.el&&document.contains(TOUR.el)){const b=TOUR.el.getBoundingClientRect();r.hidden=false;r.style.cssText=`left:${b.left-6}px;top:${b.top-6}px;width:${b.width+12}px;height:${b.height+12}px`}else r.hidden=true;
  requestAnimationFrame(placeRing)}
async function point(sel){const el=await until(sel);ringTo(el,sel);await wait(650);const b=el.getBoundingClientRect(),c=q('#tourCursor');c.hidden=false;c.style.left=(b.left+Math.min(b.width/2,60))+'px';c.style.top=(b.top+b.height/2)+'px';await wait(450);return el}
async function tap(sel){const el=await point(sel);q('#tourCursor').classList.add('press');await wait(180);q('#tourCursor').classList.remove('press');el.click();await wait(350);return el}
async function type(sel,text){const el=await point(sel);el.focus();el.value='';for(const ch of text){el.value+=ch;el.dispatchEvent(new Event('input',{bubbles:true}));await wait(55)}await wait(250);return el}
async function pick(sel,val){const el=await point(sel);el.value=val;el.dispatchEvent(new Event('change',{bubbles:true}));await wait(500)}
function say(en,ar,i){TOUR.step=i;const bar=q('#tourBar');bar.querySelector('.tour-cap').textContent=tr(en,ar);bar.querySelector('.tour-n').textContent=`${i} / ${TOUR.total}`;bar.querySelector('.tour-prog i').style.width=(i/TOUR.total*100)+'%'}
const STEPS=[
 [async()=>{say('Only authorized people can get in. Each person signs in with their own work email and password.','يدخل المصرّح لهم فقط. كل شخص يسجّل الدخول ببريد العمل وكلمة المرور الخاصة به.',1);await type('#l-email','teste@sevengt.com');await type('#l-pass','teste123');await tap('#loginForm button[type=submit]')}],
 [async()=>{say('Second step: a 6-digit code from the phone app. A stolen password alone is not enough.','الخطوة الثانية: رمز من 6 أرقام من تطبيق الهاتف. كلمة المرور المسروقة وحدها لا تكفي.',2);await type('#l-code','123456');await wait(400);await tap('#loginForm button[type=submit]');await wait(900)}],
 [async()=>{say('Every document from both Seven companies in one place: company, client, product, date, amount and status, without opening any file.','كل مستندات شركتي سفن في مكان واحد: الشركة والعميل والمنتج والتاريخ والمبلغ والحالة دون فتح أي ملف.',3);await point('.doctbl');await wait(3200)}],
 [async()=>{say('Filter by company. Each one has its own colour and code: SGT in red, ST in teal.','التصفية حسب الشركة. لكل شركة لونها ورمزها: SGT بالأحمر وST بالأخضر المزرق.',4);await tap('[data-fco="stl"]');await wait(1800);await tap('[data-fco="sgt"]');await wait(1800);await tap('[data-fco="all"]')}],
 [async()=>{say('Documents between the two Seven companies are tagged IC and can be listed on their own.','المستندات بين شركتي سفن تحمل علامة IC ويمكن عرضها وحدها.',5);await tap('[data-act="ictoggle"]');await wait(2600);await tap('[data-act="ictoggle"]')}],
 [async()=>{say('To create a document, the first question is: which company is issuing it? There is no default, so nobody issues under the wrong name.','عند إنشاء مستند، السؤال الأول: أي شركة تُصدره؟ لا يوجد اختيار افتراضي حتى لا يصدر باسم خاطئ.',6);await tap('[data-act="newdoc"]');await point('.cocards');await wait(2600);await tap('[data-pickco="stl"]');await pick('#n-type','proforma');await wait(900);await tap('[data-act="createdoc"]');await wait(900)}],
 [async()=>{say('The editor always shows which company is issuing. Numbering is separate for each company.','يعرض المحرر دائمًا الشركة المُصدِرة. الترقيم منفصل لكل شركة.',7);await point('.coband');await wait(2800)}],
 [async()=>{say('Here the client is the other Seven company. The system flags it as a document between group companies.','هنا العميل هو شركة سفن الأخرى. يميّز النظام المستند كمستند بين شركات المجموعة.',8);await pick('#e-client','g-sgt');await point('.icband');await wait(2800)}],
 [async()=>{say('Products come from the catalogue. The document updates live, and long documents continue on a new A4 page.','المنتجات من الكتالوج. يتحدّث المستند فورًا، والمستندات الطويلة تستمر في صفحة A4 جديدة.',9);await pick('#e-addp','p1');await pick('#e-addp','p2');await point('#sheet');await wait(2400)}],
 [async()=>{say('Six layouts in Seven’s colours. The team chooses the one it prefers.','ستة تصاميم بألوان سفن. يختار الفريق ما يفضّله.',10);await tap('.thumb[data-l="bold"]');await wait(1500);await tap('.thumb[data-l="exec"]');await wait(1500);await tap('.thumb[data-l="letter"]');await wait(1200)}],
 [async()=>{say('On approval the document gets its official number, is locked and archived with a digital fingerprint.','عند الموافقة يحصل المستند على رقمه الرسمي ويُقفل ويُؤرشف ببصمة رقمية.',11);await tap('[data-act="issue"]');await wait(1200);await point('.page-h h1');await wait(1600);await point('.arch');await wait(2600)}],
 [async()=>{say('Administrators see the backups: every night, a copy in the cloud and another off-site.','يرى المسؤولون النسخ الاحتياطية: كل ليلة نسخة في السحابة وأخرى خارجية.',12);await tap('.tab[data-nav="security"]');await wait(600);await point('.kpis');await wait(2200);await tap('[data-act="backupnow"]');await wait(1500)}],
 [async()=>{say('Who has access, the protection layers, and a log of every action, including blocked sign-in attempts.','من يملك صلاحية الدخول، وطبقات الحماية، وسجل لكل إجراء بما فيه محاولات الدخول المحظورة.',13);await point('.layers');await wait(2600);if(q('.tbl tr.warnrow')){await point('.tbl tr.warnrow');await wait(2400)}}],
 [async()=>{say('Buyers scan the QR code on the document to confirm it is genuine. A fake number is rejected.','يمسح المشتري رمز QR على المستند للتأكد من صحته. ويُرفض أي رقم مزيف.',14);await tap('.tab[data-nav="verify"]');await tap('[data-try]');await point('.vres');await wait(2400);await tap('[data-try="777/INV_SGT/X/2026"]');await point('.vres');await wait(2400)}],
 [async()=>{say('End of the demo. The system is now yours to explore.','نهاية العرض. يمكنك الآن استكشاف النظام بنفسك.',15);await tap('.tab[data-nav="documents"]');TOUR.el=null;TOUR.sel='';await wait(800)}]];
async function startTour(){if(TOUR.on)return;
  const lang=DB.ui.lang;DB=seed();DB.ui.lang=lang;view='documents';loginStep='pass';loginErr='';pendingUser=null;docFilter={co:'all',ic:false,type:'all',status:'all',q:''};$('#modal').hidden=true;newDlg=null;
  Object.assign(TOUR,{on:true,paused:false,stop:false,step:0,total:STEPS.length});
  document.body.classList.add('touring');q('#tourBar').hidden=false;q('#tourEnd').hidden=true;syncTourBtns();render();requestAnimationFrame(placeRing);
  try{for(const [fn] of STEPS){await fn()}q('#tourEnd').hidden=false;q('#tourBar .tour-ctl').hidden=true}
  catch(x){if(x!=='stop')console.warn('tour',x);endTour()}
  q('#tourCursor').hidden=true;q('#tourRing').hidden=true;TOUR.el=null}
function endTour(){TOUR.stop=true;TOUR.on=false;document.body.classList.remove('touring');q('#tourBar').hidden=true;q('#tourCursor').hidden=true;q('#tourRing').hidden=true;q('#tourBar .tour-ctl').hidden=false}
function syncTourBtns(){const b=q('[data-act="tourpause"]');if(b)b.textContent=TOUR.paused?tr('Play','تشغيل'):tr('Pause','إيقاف مؤقت')}
document.body.insertAdjacentHTML('beforeend',`<div id="tourRing" class="tour-ring" hidden></div><div id="tourCursor" class="tour-cursor" hidden></div>
 <div id="tourBar" class="tour-bar" hidden role="status" aria-live="polite"><div class="tour-prog"><i></i></div><div class="tour-in">
  <span class="tour-n"></span><p class="tour-cap"></p>
  <div class="tour-ctl"><button type="button" class="btn sm" data-act="tourpause"></button><button type="button" class="btn sm ghost" data-act="tourstop"></button></div>
  <div class="tour-ctl" id="tourEnd" hidden><button type="button" class="btn sm primary" data-act="tourreplay"></button><button type="button" class="btn sm" data-act="tourstop"></button></div></div></div>`);
function tourLabels(){q('[data-act="tourpause"]').textContent=TOUR.paused?tr('Play','تشغيل'):tr('Pause','إيقاف مؤقت');document.querySelectorAll('[data-act="tourstop"]').forEach(b=>b.textContent=TOUR.on?tr('Stop and explore','إيقاف واستكشاف'):tr('Close','إغلاق'));q('[data-act="tourreplay"]').textContent=tr('Watch again','مشاهدة مرة أخرى')}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act^="tour"]');if(!b||!ev.isTrusted&&b.dataset.act!=='tourstart')return;
  const a=b.dataset.act;if(a==='tourstart'){startTour();tourLabels()}else if(a==='tourpause'){TOUR.paused=!TOUR.paused;tourLabels()}else if(a==='tourstop'){endTour()}else if(a==='tourreplay'){endTour();setTimeout(()=>{TOUR.stop=false;startTour();tourLabels()},120)}},true);
document.addEventListener('click',ev=>{if(TOUR.on&&ev.isTrusted&&!ev.target.closest('#tourBar,[data-act^="tour"]')){TOUR.paused=true;tourLabels()}},true);
document.addEventListener('keydown',ev=>{if(TOUR.on&&ev.key==='Escape')endTour()});

render();tourLabels();
if(location.hash==='#demo')setTimeout(()=>{startTour();tourLabels()},600);
})();
</script>
